<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quantum Sure Success - Cosmic Frequency & Vedic Scan</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN for instant guaranteed styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              cinzel: ['Cinzel', 'serif'],
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              gold: {
                300: '#f6e05e',
                400: '#ecc94b',
                500: '#d4af37',
                600: '#b7941f',
                700: '#97750c',
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        background: radial-gradient(circle at 50% 0%, #062329 0%, #031418 60%, #010a0c 100%);
        background-attachment: fixed;
        color: #f1f5f9;
        font-family: 'Inter', sans-serif;
        min-height: 100vh;
      }
      .font-cinzel {
        font-family: 'Cinzel', serif;
      }
      .text-gold-gradient {
        background: linear-gradient(135deg, #fff3c4 0%, #d4af37 50%, #aa820a 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .glass-card {
        background: rgba(10, 37, 44, 0.85);
        backdrop-filter: blur(16px);
        border: 1px solid rgba(212, 175, 55, 0.3);
        box-shadow: 0 15px 35px -10px rgba(0, 0, 0, 0.6), 0 0 25px -5px rgba(212, 175, 55, 0.15);
      }
      .btn-gold {
        background: linear-gradient(135deg, #f6e05e 0%, #d4af37 50%, #b7941f 100%);
        color: #031418;
        font-weight: 800;
        box-shadow: 0 4px 20px rgba(212, 175, 55, 0.35);
        transition: all 0.3s ease;
      }
      .btn-gold:hover {
        background: linear-gradient(135deg, #fff3c4 0%, #ecc94b 50%, #d4af37 100%);
        box-shadow: 0 6px 30px rgba(212, 175, 55, 0.6);
        transform: translateY(-2px);
      }
      .btn-emerald {
        background: linear-gradient(135deg, #34d399 0%, #10b981 50%, #059669 100%);
        color: #031418;
        font-weight: 800;
        box-shadow: 0 4px 20px rgba(16, 185, 129, 0.35);
        transition: all 0.3s ease;
      }
      .btn-emerald:hover {
        background: linear-gradient(135deg, #6ee7b7 0%, #34d399 50%, #10b981 100%);
        box-shadow: 0 6px 30px rgba(16, 185, 129, 0.6);
        transform: translateY(-2px);
      }
    </style>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
